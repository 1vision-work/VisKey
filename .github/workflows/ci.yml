# VisKey CI: Linux (.deb) and macOS (.app/.dmg). MIT License, 1VISION.
# A v* tag also publishes a GitHub pre-release; windows.yml appends the Windows files to the same release.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python engine tests
        run: python3 tests/test_python_engine.py

      - name: Linux settings logic tests
        run: |
          python3 tests/test_linux_settings.py
          python3 tests/test_linux_update_check.py

      - name: Python typing regression
        run: |
          python3 tests/gen_typing_regression.py --check
          python3 tests/test_typing_regression.py

      - name: Design tokens check
        run: python3 tests/test_design_tokens.py

      - name: CMake build + ctest
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ctest --test-dir build --output-on-failure

      - name: C++ engine tests (g++ -Wall -Wextra)
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra tests/test_cpp_engine.cpp -o /tmp/test_cpp_engine
          /tmp/test_cpp_engine
          g++ -std=c++17 -O2 -Wall -Wextra -Werror tests/test_typing_regression.cpp -o /tmp/test_typing_regression
          /tmp/test_typing_regression

      - name: CLI smoke test
        run: echo q | ./build/viskey_cli >/dev/null

      # v1.1.0-beta.5 tag -> ibus-viskey_1.1.0~beta.5_all.deb (Debian form of the tag version).
      - name: Build .deb
        run: |
          bash scripts/build_linux_deb.sh
          ls -l ibus-viskey_*_all.deb
          deb="ibus-viskey_$(bash scripts/viskey_version.sh --deb)_all.deb"
          test -f "$deb" || { echo "missing $deb"; exit 1; }
          test "$(dpkg-deb --field "$deb" Version)" = "$(bash scripts/viskey_version.sh --deb)"

      - name: Inspect .deb
        run: |
          dpkg-deb --info ibus-viskey_*_all.deb
          dpkg-deb --contents ibus-viskey_*_all.deb

      - name: Install .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y ibus python3-gi gir1.2-ibus-1.0 python3-tk gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
          sudo dpkg -i ibus-viskey_*_all.deb

      - name: Verify installed files
        run: |
          for f in \
            /usr/bin/viskey-settings \
            /usr/libexec/ibus-engine-viskey \
            /usr/share/viskey/core/viskey_engine.py \
            /usr/share/viskey/ibus/ibus_viskey.py \
            /usr/share/viskey/ibus/viskey_settings.py \
            /usr/share/ibus/component/viskey.xml \
            /usr/share/applications/viskey-settings.desktop \
            /usr/share/viskey/ibus/viskey_settings_tk.py \
            /usr/share/viskey/ibus/viskey_settings_model.py \
            /usr/share/viskey/ibus/viskey_version.py \
            /usr/share/viskey/icons/appicon-1024.svg \
            /usr/share/viskey/icons/hicolor/scalable/actions/viskey-sliders-symbolic.svg \
            /usr/share/viskey/icons/hicolor/scalable/actions/viskey-bolt-symbolic.svg \
            /usr/share/viskey/icons/hicolor/scalable/actions/viskey-info-symbolic.svg \
            /usr/share/icons/hicolor/scalable/apps/org.viskey.Settings.svg; do
            test -f "$f" || { echo "missing $f"; exit 1; }
            echo "ok $f"
          done
          test -x /usr/bin/viskey-settings
          test -x /usr/libexec/ibus-engine-viskey
          grep -qx 'Icon=org.viskey.Settings' /usr/share/applications/viskey-settings.desktop
          grep -qx 'Name=VisKey' /usr/share/applications/viskey-settings.desktop

      # ibus_viskey only loads the IBus typelib at import time (no display or bus needed).
      # viskey_settings only builds GUI objects under main(), so it must import without a display;
      # the Tk fallback is only syntax-checked in memory
      # (py_compile would try to write __pycache__ into the read-only /usr/share).
      - name: Import check (installed package)
        working-directory: /tmp
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/share/viskey/ibus'); import ibus_viskey; assert ibus_viskey.IBus is not None, 'IBus typelib not available'; assert ibus_viskey.settings_model is not None; print('ibus_viskey OK')"
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '/usr/share/viskey/ibus'); import viskey_settings as s, viskey_settings_model as m, viskey_version as v; assert s.HAVE_GTK, 'GTK4/libadwaita typelibs not available'; assert s.VERSION == v.VERSION; assert v.VERSION == sys.argv[1], (v.VERSION, sys.argv[1]); print('viskey_settings OK', v.VERSION)" "$(bash "$GITHUB_WORKSPACE/scripts/viskey_version.sh")"
          /usr/bin/python3 -c "import sys; p = sys.argv[1]; compile(open(p, encoding='utf-8').read(), p, 'exec'); print('viskey_settings_tk syntax OK')" /usr/share/viskey/ibus/viskey_settings_tk.py

      # Renders every settings tab (light + dark) offscreen with demo data; no real config, no network.
      - name: Settings UI screenshots (xvfb)
        env:
          GTK_A11Y: none
        run: |
          timeout 180 xvfb-run -a /usr/bin/python3 linux/ibus/viskey_settings.py --ui-snapshot "$RUNNER_TEMP/viskey-linux-screenshots"
          ls -l "$RUNNER_TEMP/viskey-linux-screenshots"
          for n in general macros about about-update; do
            for s in light dark; do
              test -s "$RUNNER_TEMP/viskey-linux-screenshots/linux-$n-$s.png" || { echo "missing linux-$n-$s.png"; exit 1; }
            done
          done

      # Not on v* tags: the release job publishes every artifact of the run as release files.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: viskey-linux-screenshots
          path: ${{ runner.temp }}/viskey-linux-screenshots/*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: viskey-linux-deb
          path: ibus-viskey_*_all.deb
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: C++ engine tests (clang++)
        run: |
          clang++ -std=c++17 -O2 -Wall -Wextra tests/test_cpp_engine.cpp -o /tmp/test_cpp_engine
          /tmp/test_cpp_engine

      - name: Python engine tests
        run: |
          python3 tests/test_python_engine.py
          python3 tests/test_typing_regression.py

      - name: CMake build (VisKey.app) + ctest
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          test -d build/VisKey.app
          ctest --test-dir build --output-on-failure

      # The script ends with an interactive "install now?" prompt: answer n.
      - name: Build installer (.app + .dmg)
        run: echo n | bash scripts/build_macos_installer.sh

      - name: Verify VisKey.app and .dmg
        run: |
          app=build_macos/VisKey.app
          lipo -archs "$app/Contents/MacOS/VisKey"
          lipo -archs "$app/Contents/MacOS/VisKey" | grep -q arm64
          codesign -v --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          ver="$(bash scripts/viskey_version.sh)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$ver"
          dmg="VisKey-$ver-macOS.dmg"
          test -f "$dmg"
          hdiutil imageinfo "$dmg" >/dev/null
          ls -l "$dmg"

      # Offscreen UI screenshots: no event tap, no Accessibility prompt, in-memory demo settings.
      # macOS has no `timeout`; perl's alarm kills the app if it hangs.
      - name: UI snapshots (--ui-snapshot)
        run: |
          shots="$RUNNER_TEMP/shots"
          rm -rf "$shots"
          status=0
          perl -e 'alarm shift; exec @ARGV' 120 \
            build_macos/VisKey.app/Contents/MacOS/VisKey --ui-snapshot "$shots" || status=$?
          echo "VisKey --ui-snapshot exit status: $status"
          ls -l "$shots" || true
          count=$(find "$shots" -name '*.png' -size +1k | wc -l | tr -d ' ')
          echo "PNG files: $count"
          test "$count" -gt 0

      - uses: actions/upload-artifact@v4
        with:
          name: viskey-macos
          path: VisKey-*-macOS.dmg
          if-no-files-found: error

      # Not on v* tags: the release job publishes every artifact of the run as release files.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: viskey-macos-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: error

  release:
    name: Pre-release
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Repo-wide group shared with windows.yml: the two release jobs run one after the other,
    # so the second one appends its files to the release the first one created.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            VisKey ${{ github.ref_name }} - bộ gõ tiếng Việt Telex/VNI (Vietnamese input method). MIT License, by 1VISION.

            **Windows** (x64 / ARM64)
            - Portable: unzip `VisKey-*-Windows-*-portable.zip` and run `VisKey.exe` (a single exe, no installation). Toggle Vietnamese with Ctrl+Space or Alt+Z.
            - Or run `VisKey-*-Windows-Setup.exe` (x64, per-user install, no admin needed).
            - The binaries are unsigned: on the SmartScreen prompt click "More info" -> "Run anyway".

            **macOS** (Apple Silicon + Intel)
            - Open `VisKey-*-macOS.dmg` and drag VisKey.app into Applications.
            - The app is ad-hoc signed: right-click VisKey.app -> Open the first time (or `xattr -cr /Applications/VisKey.app`).
            - Grant Accessibility: System Settings -> Privacy & Security -> Accessibility -> VisKey.

            **Linux** (IBus, Debian/Ubuntu)
            - `sudo apt install ./ibus-viskey_*_all.deb`
            - `ibus restart`, then add "VisKey" in your input sources. Settings: `viskey-settings`.

            Windows files are attached by a separate workflow and may appear a few minutes later.
