# VisKey for Windows: VisKey.exe, portable zip and optional installer. MIT License, 1VISION.
# A v* tag also attaches the Windows files to the GitHub pre-release created by ci.yml (same tag).
name: Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    # ARM64 is best effort: it never blocks the x64 artifact or the release.
    continue-on-error: ${{ matrix.arch == 'ARM64' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # Developer environment of the newest installed Visual Studio (for dumpbin). Host x64 tools on
      # both legs: dumpbin inspects ARM64 binaries just as well.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # v1.1.0-beta.5 tag -> 1.1.0-beta.5; other builds use the default in linux/ibus/viskey_version.py.
      - name: Version
        id: version
        shell: bash
        run: |
          v="$(bash scripts/viskey_version.sh)"
          arch="$(echo '${{ matrix.arch }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$(bash scripts/viskey_version.sh --numeric)" >> "$GITHUB_OUTPUT"
          echo "zip=VisKey-$v-Windows-$arch-portable.zip" >> "$GITHUB_OUTPUT"
          echo "VisKey $v ($arch)"

      # No -G: CMake defaults to the newest installed Visual Studio generator.
      - name: Configure
        run: |
          cmake --version
          cmake -S . -B build -A ${{ matrix.arch }} "-DVISKEY_VERSION=${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        if: matrix.arch == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify VisKey.exe
        run: |
          $exe = 'build\Release\VisKey.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $expected = @{ x64 = '8664 machine (x64)'; ARM64 = 'AA64 machine (ARM64)' }['${{ matrix.arch }}']
          $headers = dumpbin /nologo /headers $exe | Out-String
          if ($headers -notmatch [regex]::Escape($expected)) { throw "not a ${{ matrix.arch }} PE: expected '$expected'" }
          if ($headers -notmatch 'subsystem \(Windows GUI\)') { throw 'not a GUI subsystem executable' }
          Write-Host "PE: $expected, Windows GUI"

          $deps = dumpbin /nologo /dependents $exe | Select-String -Pattern '^\s+\S+\.dll\s*$' | ForEach-Object { $_.Line.Trim() }
          Write-Host "Dependencies:`n  $($deps -join "`n  ")"
          $bad = $deps | Where-Object { $_ -match '(?i)^(vcruntime|msvcp|ucrtbase|api-ms-win-crt|concrt|libstdc|libgcc|libwinpthread)' }
          if ($bad) { throw "non-system DLL dependencies: $($bad -join ', ')" }
          $allowed = 'kernel32.dll','user32.dll','gdi32.dll','shell32.dll','comctl32.dll','advapi32.dll','ole32.dll','shlwapi.dll','uxtheme.dll','imm32.dll'
          $unknown = $deps | Where-Object { $allowed -notcontains $_.ToLower() }
          if ($unknown) { throw "unexpected DLL dependencies: $($unknown -join ', ')" }

          $info = (Get-Item $exe).VersionInfo
          Write-Host "ProductName=$($info.ProductName) CompanyName=$($info.CompanyName) ProductVersion=$($info.ProductVersion)"
          if ($info.ProductName -ne 'VisKey' -or $info.CompanyName -ne '1VISION') { throw 'bad version resource' }
          if ($info.ProductVersion -ne '${{ steps.version.outputs.version }}') { throw 'version resource does not match the build version' }
          Write-Host "Size: $((Get-Item $exe).Length) bytes"

      # Renders every settings page + the tray flyout offscreen (no hooks, no tray, no registry).
      - name: UI screenshots (--ui-snapshot)
        if: matrix.arch == 'x64'
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'shots'
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath build\Release\VisKey.exe -ArgumentList '--ui-snapshot', "`"$out`"" -PassThru
          $null = $p.Handle  # keep the handle so ExitCode is available afterwards
          try {
            Wait-Process -Id $p.Id -Timeout 120 -ErrorAction Stop
          } catch {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'VisKey.exe --ui-snapshot did not finish within 120 s'
          }
          $p.WaitForExit()
          if (Test-Path "$out\snapshot.txt") { Get-Content "$out\snapshot.txt" }
          $pngs = Get-ChildItem -Path $out -Filter *.png
          if (-not $pngs) { throw "no PNG produced (exit code $($p.ExitCode))" }
          if ($p.ExitCode -ne 0) { throw "--ui-snapshot exited with $($p.ExitCode)" }
          $pngs | ForEach-Object { Write-Host "$($_.Name) $($_.Length) bytes" }

      - uses: actions/upload-artifact@v4
        # Not on v* tags: the release job publishes the viskey-windows* artifacts as release files.
        if: ${{ matrix.arch == 'x64' && !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: viskey-windows-screenshots
          path: ${{ runner.temp }}/shots/
          if-no-files-found: error

      # Like UniKey: one self-contained VisKey.exe (no installer, no Python), plus license and readme.
      - name: Portable zip
        run: |
          $stage = 'dist\stage'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build\Release\VisKey.exe $stage\
          Copy-Item LICENSE $stage\LICENSE.txt
          # CRLF so old Notepad versions show the text correctly.
          (Get-Content windows\README-Windows.txt -Raw -Encoding utf8) -replace "`r?`n", "`r`n" |
            Set-Content $stage\README-Windows.txt -Encoding utf8 -NoNewline
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\${{ steps.version.outputs.zip }}" -Force
          Remove-Item -Recurse $stage

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("$PWD\dist\${{ steps.version.outputs.zip }}")
          $names = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
          $zip.Dispose()
          Write-Host "Zip contents: $($names -join ', ')"
          $expected = @('LICENSE.txt', 'README-Windows.txt', 'VisKey.exe')
          if (Compare-Object $names $expected) { throw "unexpected zip contents: $($names -join ', ')" }
          Get-ChildItem dist

      - name: Installer (optional, Inno Setup)
        if: matrix.arch == 'x64'
        continue-on-error: true
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($p in "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") {
              if (Test-Path $p) { $iscc = $p }
            }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup not available; skipping installer' }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DAppVersionNumeric=${{ steps.version.outputs.numeric }}" "/DSourceExe=$PWD\build\Release\VisKey.exe" "/DRepoRoot=$PWD" "/O$PWD\dist" windows\installer\VisKey.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          $setup = "dist\VisKey-${{ steps.version.outputs.version }}-Windows-Setup.exe"
          if (-not (Test-Path $setup)) { throw "missing $setup" }
          $info = (Get-Item $setup).VersionInfo
          Write-Host "Setup: ProductName=$($info.ProductName) CompanyName=$($info.CompanyName) ProductVersion=$($info.ProductVersion)"
          if ($info.ProductName -ne 'VisKey' -or $info.CompanyName -ne '1VISION') { throw 'bad installer version resource' }
          if ($info.ProductVersion -ne '${{ steps.version.outputs.version }}') { throw 'installer version does not match the build version' }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch == 'x64' && 'viskey-windows' || 'viskey-windows-arm64' }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Pre-release (Windows files)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Same repo-wide group as the release job in ci.yml: whichever runs second appends to the
    # release the first one created, so one tag yields one pre-release.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: viskey-windows*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      # No body here: ci.yml writes the release notes (incl. the CODE_SIGNING_POLICY.md link). An
      # update without a body keeps the existing notes, so the order of the two jobs does not matter.
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
